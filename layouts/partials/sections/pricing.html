{{ with site.Data.site.pricing }}
<svg class="price-card__defs" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="price-ticket-notch" clipPathUnits="objectBoundingBox">
      <path d="M 0.028 0.01 Q 0.028 0 0.038 0 H 0.406 C 0.43 0 0.444 0.024 0.5 0.024 C 0.556 0.024 0.57 0 0.594 0 H 0.962 Q 0.972 0 0.972 0.01 V 0.99 Q 0.972 1 0.962 1 H 0.038 Q 0.028 1 0.028 0.99 Z"/>
    </clipPath>
  </defs>
</svg>
<section class="pricing section" id="pricing">
  <div class="container">
    <h2 class="section-title section-title--center">{{ .title }}</h2>
    {{ with .text }}
      <p class="pricing__subtitle">{{ . }}</p>
    {{ end }}
    <div class="pricing__layout">
      <div class="pricing__cards">
        {{ range .plans }}
          <article class="price-card{{ if .featured }} price-card--featured{{ end }}">
            <div class="price-card__shadow">
              <div class="price-card__paper">
                <svg class="price-card__border" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="#d8d8d8"
                    stroke-width="1"
                    vector-effect="non-scaling-stroke"
                    d="M 6.8 5 Q 6.8 4 7.8 4 H 40.6 C 43 4 44.4 6.4 50 6.4 C 55.6 6.4 57 4 59.4 4 H 93.2 Q 94.2 4 94.2 5 V 95 Q 94.2 96 93.2 96 H 7.8 Q 6.8 96 6.8 95 Z"
                  />
                </svg>
                <div class="price-card__rule">
                  <h3 class="price-card__title">{{ .title }}</h3>
                <ul class="price-card__features">
                  {{ range .features }}<li>{{ . }}</li>{{ end }}
                </ul>
                <p class="price-card__price">{{ .price }} <span>{{ .currency }}</span></p>
                <div class="price-card__action">
                  {{ partial "btn-book.html" .button }}
                </div>
                </div>
              </div>
            </div>
          </article>
        {{ end }}
      </div>
    </div>
  </div>
</section>
{{ end }}
